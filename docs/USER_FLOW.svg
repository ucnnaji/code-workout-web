<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
<style>.title{font:700 34px Arial;fill:#172033}.box{fill:#fff;stroke:#155eef;stroke-width:2;rx:14}.n{fill:#155eef}.num{font:700 20px Arial;fill:#fff}.h{font:700 21px Arial;fill:#172033}.d{font:16px Arial;fill:#667085}.arrow{stroke:#98a2b3;stroke-width:3;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#98a2b3"/></marker></defs>
<rect width="1200" height="1500" fill="#f5f7fb"/><text x="60" y="62" class="title">Code Workout — participant study flow</text>
<g id="steps">
<g transform="translate(90 110)"><rect class="box" width="1020" height="92"/><circle class="n" cx="38" cy="46" r="24"/><text class="num" x="32" y="53">1</text><text class="h" x="80" y="38">Research information</text><text class="d" x="80" y="66">Student reviews the study overview and continues.</text></g>
<g transform="translate(90 225)"><rect class="box" width="1020" height="92"/><circle class="n" cx="38" cy="46" r="24"/><text class="num" x="32" y="53">2</text><text class="h" x="80" y="38">Informed consent</text><text class="d" x="80" y="66">Consent is completed before study credentials are created.</text></g>
<g transform="translate(90 340)"><rect class="box" width="1020" height="108"/><circle class="n" cx="38" cy="54" r="24"/><text class="num" x="32" y="61">3</text><text class="h" x="80" y="40">Create study access</text><text class="d" x="80" y="68">Student chooses a non-identifying Participant ID and Python or Java.</text><text class="d" x="80" y="91">The server generates a one-time-display Private Access Key.</text></g>
<g transform="translate(90 471)"><rect class="box" width="1020" height="92"/><circle class="n" cx="38" cy="46" r="24"/><text class="num" x="32" y="53">4</text><text class="h" x="80" y="38">Language-tailored pre-survey</text><text class="d" x="80" y="66">Same survey items and scoring; only Python/Java wording is adapted.</text></g>
<g transform="translate(90 586)"><rect class="box" width="1020" height="92"/><circle class="n" cx="38" cy="46" r="24"/><text class="num" x="32" y="53">5</text><text class="h" x="80" y="38">Practice environment demo + language confirmation</text><text class="d" x="80" y="66">Student sees the interface labels, then confirms the selected language.</text></g>
<g transform="translate(90 701)"><rect class="box" width="1020" height="108"/><circle class="n" cx="38" cy="54" r="24"/><text class="num" x="32" y="61">6</text><text class="h" x="80" y="40">Four-question locked practice sequence</text><text class="d" x="80" y="68">Primary modality Q1 → primary modality Q2 → second modality Q1 → third modality Q1.</text><text class="d" x="80" y="91">The next modality unlocks only after the current modality is completed.</text></g>
<g transform="translate(90 832)"><rect class="box" width="1020" height="108"/><circle class="n" cx="38" cy="54" r="24"/><text class="num" x="32" y="61">7</text><text class="h" x="80" y="40">Modality-specific workspace</text><text class="d" x="80" y="68">Problem Solving / Debugging: compact editor + Run Code + output + visible score.</text><text class="d" x="80" y="91">Code Explanation: read-only code + explanation + Check Explanation; no Run Code.</text></g>
<g transform="translate(90 963)"><rect class="box" width="1020" height="92"/><circle class="n" cx="38" cy="46" r="24"/><text class="num" x="32" y="53">8</text><text class="h" x="80" y="38">Language-tailored post-survey</text><text class="d" x="80" y="66">Same post-survey items; programming-language references match the student.</text></g>
<g transform="translate(90 1078)"><rect class="box" width="1020" height="92"/><circle class="n" cx="38" cy="46" r="24"/><text class="num" x="32" y="53">9</text><text class="h" x="80" y="38">Incentive</text><text class="d" x="80" y="66">Compensation handling remains separate from research-response exports.</text></g>
<g transform="translate(90 1193)"><rect class="box" width="1020" height="92"/><circle class="n" cx="38" cy="46" r="24"/><text class="num" x="25" y="53">10</text><text class="h" x="80" y="38">Completion and return instructions</text><text class="d" x="80" y="66">Student keeps the same Participant ID and Private Access Key for later sessions.</text></g>
<g transform="translate(90 1308)"><rect class="box" width="1020" height="108"/><circle class="n" cx="38" cy="54" r="24"/><text class="num" x="25" y="61">11</text><text class="h" x="80" y="40">Research administration</text><text class="d" x="80" y="68">Survey exports, entry-lock tracking, release readiness, and test/live controls.</text><text class="d" x="80" y="91">Supabase retains pseudonymous responses and scores; private identifiers stay separated.</text></g>
</g>
<path class="arrow" d="M600 202 L600 225"/><path class="arrow" d="M600 317 L600 340"/><path class="arrow" d="M600 448 L600 471"/><path class="arrow" d="M600 563 L600 586"/><path class="arrow" d="M600 678 L600 701"/><path class="arrow" d="M600 809 L600 832"/><path class="arrow" d="M600 940 L600 963"/><path class="arrow" d="M600 1055 L600 1078"/><path class="arrow" d="M600 1170 L600 1193"/><path class="arrow" d="M600 1285 L600 1308"/>
</svg>
